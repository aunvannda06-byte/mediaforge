services:
  - type: web
    name: mediaforge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAX_MB
        value: "5120"
      - key: MAX_JOBS
        value: "1"
      - key: RATE_PER_HOUR
        value: "20"
      - key: CLOUDINARY_URL   # cloudinary://API_KEY:API_SECRET@CLOUD_NAME (Photo Editor AI tools)
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"   # change to your Netlify / GitHub Pages URL once the site is live
